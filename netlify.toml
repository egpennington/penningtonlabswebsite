[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
 

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

[functions]
node_bundler = "esbuild"
